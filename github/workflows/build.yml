name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Arrange project
        run: |
          mkdir -p app/src/main/java/app/hiddenrule app/src/main/assets
          mv MainActivity*.kt app/src/main/java/app/hiddenrule/MainActivity.kt
          mv AndroidManifest*.xml app/src/main/AndroidManifest.xml
          mv index*.html app/src/main/assets/index.html
          echo "android.useAndroidX=true" > gradle.properties
          cat > settings.gradle.kts <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "HiddenRule"
          include(":app")
          GRADLE
          cat > app/build.gradle.kts <<'GRADLE'
          plugins {
              id("com.android.application") version "8.5.2"
              id("org.jetbrains.kotlin.android") version "1.9.24"
          }
          android {
              namespace = "app.hiddenrule"
              compileSdk = 34
              defaultConfig {
                  applicationId = "app.hiddenrule"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies { implementation("com.google.android.gms:play-services-ads:23.3.0") }
          GRADLE
      - run: gradle assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
